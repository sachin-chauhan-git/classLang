<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom Translation Platform</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 420px;
      background: #fff;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      border: 1px solid #e5e5e5;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 25px;
      color: #111;
    }

    /* PREMIUM ROLE SELECT */
    .role-select {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 30px;
    }

    .role-card {
      flex: 1;
      padding: 22px 10px;
      border-radius: 14px;
      background: #fafafa;
      border: 2px solid #ddd;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .role-card h3 {
      font-size: 17px;
      font-weight: 600;
      color: #222;
    }

    .role-card:hover {
      border-color: #111;
    }

    .role-active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .role-active h3 {
      color: #fff;
    }

    /* LOGIN / SIGNUP BUTTONS */
    .switch-row {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .switch-btn {
      padding: 10px 24px;
      background: #eee;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.25s ease;
    }

    .switch-btn:hover {
      background: #ddd;
    }

    .active {
      background: #111;
      color: #fff;
    }

    /* INPUT FIELDS */
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      background: #fff;
    }

    input:focus {
      border-color: #111;
      outline: none;
    }

    /* MAIN BUTTON */
    .main-btn {
      width: 100%;
      padding: 13px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      margin-top: 10px;
      transition: 0.25s;
    }

    .main-btn:hover {
      background: #333;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1> Login / SignUp </h1>

    <div class="role-select">
      <div class="role-card role-active" id="studentCard">
        <h3>🎓 Student</h3>
      </div>
      <div class="role-card" id="teacherCard">
        <h3>👨‍🏫 Teacher</h3>
      </div>
    </div>

    <div class="switch-row">
      <button class="switch-btn active" id="loginBtn">Login</button>
      <button class="switch-btn" id="signupBtn">Sign Up</button>
    </div>

    <div id="formArea">
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Password" />
      <button class="main-btn">Login</button>
    </div>
  </div>

</body>
</html>
