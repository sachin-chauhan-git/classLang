<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom Translation Platform</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 420px;
      background: #fff;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      border: 1px solid #e5e5e5;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 25px;
      color: #111;
    }

    /* PREMIUM ROLE SELECT */
    .role-select {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 30px;
    }

    .role-card {
      flex: 1;
      padding: 22px 10px;
      border-radius: 14px;
      background: transparent;
      border: 2px solid #ddd;
      cursor: pointer;
      transition: all 0.3s ease;
      transform: scale(1);
    }

    .role-card h3 {
      font-size: 17px;
      font-weight: 600;
      color: #222;
      transition: all 0.3s ease;
    }

    .role-card:hover {
      background: #111;
      border-color: #111;
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .role-card:hover h3 {
      color: #fff;
    }

    .role-active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .role-active h3 {
      color: #fff;
    }

    /* LOGIN / SIGNUP BUTTONS */
    .switch-row {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .switch-btn {
      padding: 10px 24px;
      background: transparent;
      border: 2px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      color: #222;
      transform: scale(1);
    }

    .switch-btn:hover {
      background: #161616;
      border-color: #111;
      color: #fff;
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .active {
      background: #0c0c0c;
      color: #fff;
    }

    /* INPUT FIELDS */
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      background: #fff;
    }

    input:focus {
      border-color: #111;
      outline: none;
    }

    /* MAIN BUTTON */
    .main-btn {
      width: 100%;
      padding: 13px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      margin-top: 10px;
      transition: all 0.3s ease;
      transform: scale(1);
    }

    .main-btn:hover {
      background: #000;
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    /* SOCIAL LOGIN */
    .divider {
      margin: 25px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #999;
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    .social-login {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .social-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #ddd;
      background: #fff;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.25s ease;
      padding: 0;
    }

    .social-btn:hover {
      border-color: #111;
      transform: scale(1.1);
    }

    .social-btn img {
      width: 28px;
      height: 28px;
    }

    .divider{
      border-color: black;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1> Login / SignUp </h1>

    <div class="role-select">
      <div class="role-card" id="studentCard">
        <h3>🎓 Student</h3>
      </div>
      <div class="role-card" id="teacherCard">
        <h3>👨‍🏫 Teacher</h3>
      </div>
    </div>

    <div class="switch-row">
      <button class="switch-btn" id="loginBtn">Login</button>
      <button class="switch-btn" id="signupBtn">Sign Up</button>
    </div>

    <div id="formArea">
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Password" />
      <button class="main-btn">Login</button>

      <div class="divider">Or continue with</div>

      <div class="social-login" border-color="black">
        <a href="https://www.google.com" target="_blank" class="social-btn" title="Login with Google">
        <img src="https://freelogopng.com/images/all_img/1657952641google-logo-png-image.png" alt="Google" />
        </a>
        <a href="https://www.linkedin.com" target="_blank" class="social-btn" title="Login with LinkedIn">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/LinkedIn_logo_initials.png/480px-LinkedIn_logo_initials.png" alt="LinkedIn" />
        </a>
        <a href="https://twitter.com" target="_blank" class="social-btn" title="Login with Twitter">
        <img src="https://clipartcraft.com/images/twitter-logo-transparent-background-2.png" alt="Twitter" />
        </a>
        <a href="https://www.facebook.com" target="_blank" class="social-btn" title="Login with Facebook">
        <img src="https://th.bing.com/th/id/OIP.d9GZxbX8Gi9_qGg7XP1ntgHaHa?o=7&cb=ucfimg2rm=3&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Facebook" />
        </a>
      </div>
    </div>
  </div>

</body>
</html>
