<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Classroom Translation Platform</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 420px;
      background: #fff;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      border: 1px solid #e5e5e5;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 25px;
      color: #111;
    }

    /* ROLE SELECT */
    .role-select {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 30px;
    }

    .role-card {
      flex: 1;
      padding: 22px 10px;
      border-radius: 14px;
      background: transparent;
      border: 2px solid #ddd;
      cursor: pointer;
      transition: all 0.3s ease;
      transform: scale(1);
    }

    .role-card h3 {
      font-size: 17px;
      font-weight: 600;
      color: #222;
      transition: all 0.3s ease;
    }

    .role-card:hover {
      background: #111;
      border-color: #111;
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .role-card:hover h3 {
      color: #fff;
    }

    .role-active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .role-active h3 {
      color: #fff;
    }

    /* INPUT FIELDS */
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      background: #fff;
    }

    input:focus {
      border-color: #111;
      outline: none;
    }

    /* MAIN BUTTON */
    .main-btn {
      width: 100%;
      padding: 13px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      margin-top: 15px;
      transition: all 0.3s ease;
      transform: scale(1);
    }

    .main-btn:hover {
      background: #000;
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    /* LOGIN LINK */
    .login-link {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }

    .login-link a {
      color: #111;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .login-link a:hover {
      color: #555;
    }

    /* SOCIAL LOGIN */
    .divider {
      margin: 25px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #999;
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    .social-login {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .social-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #ddd;
      background: #fff;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.25s ease;
      padding: 0;
    }

    .social-btn:hover {
      border-color: #111;
      transform: scale(1.1);
    }

    .social-btn img {
      width: 28px;
      height: 28px;
    }

    .divider {
      border-color: black;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>Create Account</h1>

    <div class="role-select">
      <div class="role-card" id="studentCard">
        <h3>🎓 Student</h3>
      </div>
      <div class="role-card" id="teacherCard">
        <h3>👨‍🏫 Teacher</h3>
      </div>
    </div>

    <div id="formArea">
      <form id="signupForm">
        <input type="text" placeholder="First Name" id="firstName" required />
        <input type="text" placeholder="Last Name" id="lastName" required />
        <input type="email" placeholder="Email" id="email" required />
        <input type="password" placeholder="Password" id="password" required />
        <button class="main-btn" type="submit">Sign Up</button>
        <p id="signupError" style="color: red; margin-top: 10px; display: none;"></p>
        <p id="signupLoading" style="color: #666; margin-top: 10px; display: none;">Creating account...</p>
      </form>

      <div class="login-link">
        Already have an account? <a href="login.html">Login here</a>
      </div>

      <div class="divider">Or sign up with</div>

      <div class="social-login">
        <a href="https://accounts.google.com/o/oauth2/v2/auth?client_id=YOUR_GOOGLE_CLIENT_ID&redirect_uri=http://localhost:3000/auth/google/callback&response_type=code&scope=openid%20email%20profile&state=signup" target="_blank" class="social-btn" title="Sign up with Google">
          <img src="https://freelogopng.com/images/all_img/1657952641google-logo-png-image.png" alt="Google" />
        </a>
        <a href="https://www.linkedin.com/oauth/v2/authorization?client_id=YOUR_LINKEDIN_CLIENT_ID&redirect_uri=http://localhost:3000/auth/linkedin/callback&response_type=code&scope=openid%20profile%20email&state=signup" target="_blank" class="social-btn" title="Sign up with LinkedIn">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/LinkedIn_logo_initials.png/480px-LinkedIn_logo_initials.png" alt="LinkedIn" />
        </a>
        <a href="https://twitter.com/i/oauth2/authorize?client_id=YOUR_TWITTER_CLIENT_ID&redirect_uri=http://localhost:3000/auth/twitter/callback&response_type=code&scope=tweet.read%20users.read&state=signup" target="_blank" class="social-btn" title="Sign up with Twitter">
          <img src="https://clipartcraft.com/images/twitter-logo-transparent-background-2.png" alt="Twitter" />
        </a>
        <a href="https://www.facebook.com/v18.0/dialog/oauth?client_id=YOUR_FACEBOOK_CLIENT_ID&redirect_uri=http://localhost:3000/auth/facebook/callback&scope=email,public_profile&state=signup" target="_blank" class="social-btn" title="Sign up with Facebook">
          <img src="https://th.bing.com/th/id/OIP.d9GZxbX8Gi9_qGg7XP1ntgHaHa?o=7&cb=ucfimg2rm=3&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Facebook" />
        </a>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:3001';
    let selectedRole = 'student'; // Default role

    // Role selection functionality
    const studentCard = document.getElementById('studentCard');
    const teacherCard = document.getElementById('teacherCard');

    studentCard.addEventListener('click', () => {
      studentCard.classList.add('role-active');
      teacherCard.classList.remove('role-active');
      selectedRole = 'student';
    });

    teacherCard.addEventListener('click', () => {
      teacherCard.classList.add('role-active');
      studentCard.classList.remove('role-active');
      selectedRole = 'teacher';
    });

    // Set default role
    studentCard.classList.add('role-active');

    // Form submission
    const signupForm = document.getElementById('signupForm');
    const firstNameInput = document.getElementById('firstName');
    const lastNameInput = document.getElementById('lastName');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const signupError = document.getElementById('signupError');
    const signupLoading = document.getElementById('signupLoading');

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const firstName = firstNameInput.value.trim();
      const lastName = lastNameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      // Validation
      if (!firstName || !lastName || !email || !password) {
        signupError.textContent = 'Please fill in all fields';
        signupError.style.display = 'block';
        return;
      }

      if (!email.includes('@')) {
        signupError.textContent = 'Please enter a valid email';
        signupError.style.display = 'block';
        return;
      }

      if (password.length < 6) {
        signupError.textContent = 'Password must be at least 6 characters';
        signupError.style.display = 'block';
        return;
      }

      signupError.style.display = 'none';
      signupLoading.style.display = 'block';

      try {
        const response = await fetch(`${API_BASE_URL}/users/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            firstName,
            lastName,
            email,
            password,
            role: selectedRole
          })
        });

        const data = await response.json();

        if (data.success) {
          // Store token and user data
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          signupLoading.textContent = 'Account created! Redirecting...';
          setTimeout(() => {
            window.location.href = 'Dashboard.html';
          }, 1500);
        } else {
          signupError.textContent = data.message || 'Signup failed';
          signupError.style.display = 'block';
          signupLoading.style.display = 'none';
        }
      } catch (error) {
        signupError.textContent = 'Error: ' + error.message;
        signupError.style.display = 'block';
        signupLoading.style.display = 'none';
      }
    });
  </script>

</body>
</html>
